version: 2

# Updates wait 7 days after publication: most malicious package releases are detected and pulled within that window.
# The npm (/frontend) entry is added with the web app.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are done manually:
      # - typescript: typescript-eslint (used by eslint-config-next) caps the supported TypeScript range.
      # - @types/node: must match the Node.js runtime line (24 LTS in CI and Docker).
      # - eslint: the plugins bundled by eslint-config-next must support the new major first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The backend stays on the .NET 10 (LTS) line: majors (11.x) of the framework packages are done manually,
      # together with the target framework and the base images.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # System.CommandLine 3.x is the .NET 11 line.
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]

  # Base images pinned by digest in the Dockerfiles. The .NET major must match the target framework, and the Node.js
  # major the LTS line used in CI.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
